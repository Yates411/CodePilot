name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./scripts/test.sh

      - name: Build Release .app
        run: ./scripts/bundle_app.sh release

      - name: Package .zip and .dmg with SHA256SUMS
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release_artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/CodePilot.app "release_artifacts/CodePilot-${VERSION}-arm64.zip"
          hdiutil create -volname "CodePilot ${VERSION}" -srcfolder dist/CodePilot.app -ov -format UDZO "release_artifacts/CodePilot-${VERSION}-arm64.dmg"
          (cd release_artifacts && shasum -a 256 CodePilot-* > SHA256SUMS)
          ls -lh release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_artifacts/CodePilot-*.zip
            release_artifacts/CodePilot-*.dmg
            release_artifacts/SHA256SUMS
